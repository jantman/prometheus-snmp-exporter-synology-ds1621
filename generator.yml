# FROM: https://www.reddit.com/r/PrometheusMonitoring/comments/uo0tx1/comment/i8ec4qj/
#############################################
# Synology
#
# MIBs are not vendored in this repository. regenerate.sh downloads them with
# the upstream snmp_exporter generator Makefile at the same tag as the
# Dockerfile's base image: net-snmp 5.9 MIBs, the IANA ifType MIB, and
# Synology's official MIB download, with upstream's mib-patches applied:
#   https://global.download.synology.com/download/Document/Software/DeveloperGuide/Firmware/DSM/All/enu/Synology_MIB_File.zip
#
# Tested on RS2414rp+ and DS1621+
#
# Since snmp_exporter v0.23.0, auth is configured separately from modules.
# public_v2 is the exporter's default auth name when a scrape sends no "auth"
# param, so scrape configs only need "module=synology".
auths:
  public_v2:
    community: public
    version: 2

modules:
  synology:
    max_repetitions: 22
    walk:
      - interfaces
      - sysUpTime
      - ifXTable
      - laNames
      - laLoadInt
      - ssCpuUser
      - ssCpuSystem
      - ssCpuIdle
      - memory
      - hrStorage
      - 1.3.6.1.4.1.6574.1       # synoSystem
      - 1.3.6.1.4.1.6574.2       # synoDisk
      - 1.3.6.1.4.1.6574.3       # synoRaid
      - 1.3.6.1.4.1.6574.4       # synoUPS
      - 1.3.6.1.4.1.6574.5       # synologyDiskSMART
      - 1.3.6.1.4.1.6574.6       # synologyService
      - 1.3.6.1.4.1.6574.101     # storageIO
      - 1.3.6.1.4.1.6574.102     # spaceIO
      - 1.3.6.1.4.1.6574.103     # flashcache
      - 1.3.6.1.4.1.6574.104     # synologyiSCSILUN
      - 1.3.6.1.4.1.6574.107     # synologyNFS
    lookups:
      - source_indexes: [spaceIOIndex]
        lookup: spaceIODevice
        drop_source_indexes: true
      - source_indexes: [storageIOIndex]
        lookup: storageIODevice
        drop_source_indexes: true
      - source_indexes: [serviceInfoIndex]
        lookup: serviceName
        drop_source_indexes: true
      - source_indexes: [ifIndex]
        # Use OID to avoid conflict with Netscaler NS-ROOT-MIB.
        lookup: 1.3.6.1.2.1.31.1.1.1.1 # ifName
        drop_source_indexes: true
      - source_indexes: [diskIndex]
        lookup: diskID
        drop_source_indexes: true
      - source_indexes: [raidIndex]
        lookup: raidName
        drop_source_indexes: true
      - source_indexes: [laIndex]
        lookup: laNames
        drop_source_indexes: true
      - source_indexes: [hrStorageIndex]
        lookup: hrStorageDescr
        drop_source_indexes: true
      - source_indexes: [flashCacheIndex]
        lookup: flashCacheSSDDev
        drop_source_indexes: true
      - source_indexes: [nfsIndex]
        lookup: nfsName
        drop_source_indexes: true
    overrides:
      diskModel:
        type: DisplayString
      diskSMARTAttrName:
        type: DisplayString
      diskSMARTAttrStatus:
        type: DisplayString
      diskSMARTInfoDevName:
        type: DisplayString
      diskType:
        type: DisplayString
      ifType:
        type: EnumAsInfo
      modelName:
        type: DisplayString
      raidFreeSize:
        type: gauge
      raidName:
        type: DisplayString
      raidTotalSize:
        type: gauge
      serialNumber:
        type: DisplayString
      serviceName:
        type: DisplayString
      version:
        type: DisplayString
      iSCSILUNName:
        type: DisplayString
      diskID:
        type: DisplayString
      iSCSILUNUUID:
        type: DisplayString